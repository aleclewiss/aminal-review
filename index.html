<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#131019">
<title>Aminal House Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Outfit:wght@300;400;500;600&display=swap">
<style>
  /* Aminal House palette: the channel's own hot pink on a near-black biased
     slightly violet toward it, rather than a neutral grey. */
  :root{
    --ink:#131019; --surface:#1c1824; --raised:#241f2e; --line:#332b3f;
    --fg:#f6f2f8; --dim:#a096ad; --faint:#6f6679;
    --accent:#ff3d8a; --go:#3ddc84; --stop:#ff5f56; --hold:#ffc25c;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--ink); color:var(--fg);
    font:400 16px/1.5 Outfit,system-ui,-apple-system,Segoe UI,sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }

  /* Single-card review. With dozens queued a grid means scrolling and losing
     your place; one video at a time with three big targets is a decision you
     can make in a second and repeat. */
  .wrap{height:100%; display:flex; flex-direction:column;
        max-width:560px; margin:0 auto; padding:0 14px}

  header{display:flex; align-items:center; gap:10px;
         padding:calc(12px + env(safe-area-inset-top)) 4px 10px}
  .brand{font-family:Syne,sans-serif; font-weight:800; font-size:17px;
         letter-spacing:-.01em; margin:0}
  .brand em{font-style:normal; color:var(--accent)}
  .progress{margin-left:auto; font-size:13px; color:var(--dim);
            font-variant-numeric:tabular-nums}

  .bar{height:3px; background:var(--raised); border-radius:2px; overflow:hidden;
       margin-bottom:10px}
  .bar div{height:100%; background:var(--accent); width:0; transition:width .3s ease}

  .stage{flex:1; min-height:0; display:flex; flex-direction:column;
         background:var(--surface); border:1px solid var(--line);
         border-radius:16px; overflow:hidden}
  video{flex:1; min-height:0; width:100%; background:#000; object-fit:contain}
  .meta{padding:11px 14px 9px; border-top:1px solid var(--line)}
  .title{font-weight:600; line-height:1.3; font-size:15px}
  .sub{margin-top:5px; color:var(--dim); font-size:12.5px;
       display:flex; gap:6px; align-items:center; flex-wrap:wrap}
  .pill{background:var(--raised); border:1px solid var(--line); color:#cdc5d6;
        border-radius:999px; padding:1px 9px; font-size:11.5px; font-weight:500}
  .pill.ch{color:var(--accent); border-color:rgba(255,61,138,.3)}

  .actions{display:flex; gap:9px; padding:10px 4px calc(16px + env(safe-area-inset-bottom))}
  .btn{flex:1; padding:15px 8px; border:1px solid transparent; border-radius:13px;
       font:700 15px Outfit,sans-serif; cursor:pointer; color:#120d16;
       -webkit-tap-highlight-color:transparent; transition:filter .12s ease}
  .btn:active{filter:brightness(.9)}
  .btn:disabled{opacity:.4}
  .btn:focus-visible{outline:2px solid var(--fg); outline-offset:2px}
  .go{background:var(--go); flex:1.5}
  .no{background:transparent; color:var(--stop); border-color:rgba(255,95,86,.45)}
  .later{background:transparent; color:var(--hold); border-color:rgba(255,194,92,.4)}

  .hint{text-align:center; color:var(--faint); font-size:11.5px; padding-bottom:6px}
  .toast{position:fixed; left:50%; bottom:96px; transform:translateX(-50%);
         background:var(--raised); border:1px solid var(--line); color:var(--fg);
         padding:9px 16px; border-radius:999px; font-size:13px; font-weight:500;
         opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:30}
  .toast.on{opacity:1}

  .done{flex:1; display:flex; flex-direction:column; align-items:center;
        justify-content:center; text-align:center; color:var(--dim);
        font-weight:300; gap:6px; padding:30px}
  .done strong{font-family:Syne,sans-serif; font-weight:700; color:var(--fg);
               font-size:19px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="brand">Aminal <em>House</em></h1>
    <span class="progress" id="progress"></span>
  </header>
  <div class="bar"><div id="barfill"></div></div>
  <div class="stage" id="stage"></div>
  <div class="actions" id="actions"></div>
  <div class="hint" id="hint"></div>
</div>
<div class="toast" id="toast"></div>

<script>
// No credential here. Each item carries presigned PUT URLs minted by the
// pipeline machine; the signature IS the permission and it writes one small
// object. That PC polls for them and publishes, so no YouTube / Instagram /
// TikTok token is ever present in this page.
var items = [], idx = 0, settled = {};
try { settled = JSON.parse(localStorage.getItem("settled") || "{}"); } catch(e){}

function save(){ try { localStorage.setItem("settled", JSON.stringify(settled)); } catch(e){} }
function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
  });
}
function toast(msg){
  var t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove("on"); }, 1600);
}

function pending(){ return items.filter(function(i){ return !settled[i.stem]; }); }

async function load(){
  try{
    var r = await fetch("pending.json?t=" + Date.now(), {cache:"no-store"});
    if(r.ok){ items = (await r.json()).items || []; }
  }catch(e){}
  if(idx >= pending().length) idx = 0;
  render();
}

function render(){
  var list = pending();
  var total = items.length;
  $("progress").textContent = list.length ? (total - list.length + 1) + " / " + total : "";
  $("barfill").style.width = total ? ((total - list.length) / total * 100) + "%" : "0";

  if(!list.length){
    $("stage").innerHTML = '<div class="done"><strong>All caught up</strong>' +
      '<span>New videos appear here as they finish rendering.</span></div>';
    $("actions").innerHTML = "";
    $("hint").textContent = "";
    return;
  }

  var i = list[Math.min(idx, list.length - 1)];
  $("stage").innerHTML =
    '<video id="player" src="' + esc(i.url) + '" controls autoplay muted playsinline ' +
    'preload="metadata"></video>' +
    '<div class="meta"><div class="title">' + esc(i.title || "(untitled)") + '</div>' +
    '<div class="sub"><span class="pill ch">' + esc(i.channel) + '</span>' +
    '<span class="pill">' + esc(i.category) + '</span>' +
    esc(i.size_mb) + ' MB &middot; ' + list.length + ' left</div></div>';

  // Autoplay has to start muted or mobile blocks it; unmute on first tap so
  // the clip audio — the thing being judged — is actually audible.
  var v = $("player");
  if(v){
    v.addEventListener("click", function(){ v.muted = false; }, {once:true});
    v.addEventListener("loadeddata", function(){ v.muted = false; }, {once:true});
  }

  var acts = $("actions");
  acts.innerHTML = "";
  // Two ways to record a verdict. A presigned PUT is one tap and stays on the
  // page. When storage is unavailable the item carries GitHub issue links
  // instead: the phone is already signed in to GitHub, so no credential is
  // needed here — it costs one extra tap on Submit and cannot break when a
  // storage account hits a cap.
  [["approve","Post it","btn go"],
   ["hold","Later","btn later"],
   ["reject","Skip","btn no"]].forEach(function(spec){
    var direct = i[spec[0] + "_url"];
    var issue  = i[spec[0] + "_issue"];
    if(direct){
      var b = document.createElement("button");
      b.className = spec[2]; b.textContent = spec[1];
      b.onclick = function(){ decide(i, spec[0]); };
      acts.appendChild(b);
    } else if(issue){
      var a = document.createElement("a");
      a.className = spec[2]; a.href = issue; a.target = "_blank"; a.rel = "noopener";
      a.textContent = spec[1];
      a.style.display = "flex"; a.style.alignItems = "center";
      a.style.justifyContent = "center"; a.style.textDecoration = "none";
      a.onclick = function(){
        // Mark it locally so the queue advances; the PC confirms when it sees
        // the issue. If the submit is abandoned it reappears on next refresh.
        settled[i.stem] = spec[0]; save();
        setTimeout(function(){ render(); toast("Submit the issue to confirm"); }, 400);
      };
      acts.appendChild(a);
    } else {
      var d = document.createElement("button");
      d.className = spec[2]; d.textContent = spec[1]; d.disabled = true;
      acts.appendChild(d);
    }
  });
  $("hint").textContent = i.approve_url
    ? "keys: Y post · L later · N skip · → next"
    : (i.approve_issue
        ? "opens GitHub — tap Submit to confirm, your PC does the rest"
        : "approving unavailable right now — viewing only");
}

async function decide(item, verdict){
  var url = item[verdict + "_url"];
  if(!url){ toast("Not available right now"); return; }
  // Advance immediately: waiting on the network before showing the next video
  // makes reviewing a queue of forty feel like work.
  settled[item.stem] = verdict; save();
  toast(verdict === "approve" ? "Posting…" : verdict === "hold" ? "Held" : "Skipped");
  render();
  try{
    var res = await fetch(url, {method:"PUT", body: verdict});
    if(!res.ok) throw new Error("HTTP " + res.status);
  }catch(e){
    delete settled[item.stem]; save();      // put it back rather than lose it
    toast("Couldn't save — try again");
    render();
  }
}

document.addEventListener("keydown", function(e){
  var list = pending();
  if(!list.length) return;
  var i = list[Math.min(idx, list.length - 1)];
  var k = e.key.toLowerCase();
  if(k === "y") decide(i, "approve");
  else if(k === "l") decide(i, "hold");
  else if(k === "n") decide(i, "reject");
  else if(e.key === "ArrowRight"){ idx = (idx + 1) % list.length; render(); }
  else if(e.key === "ArrowLeft"){ idx = (idx - 1 + list.length) % list.length; render(); }
});

load();
setInterval(load, 30000);
</script>
</body>
</html>
