<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>aminal.house — review</title>
<style>
  :root { --cream:#F2E7D1; --brown:#221912; --ok:#2f9e5e; --no:#b3453c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--brown); color:var(--cream);
         font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; }
  header { padding:18px 16px 10px; position:sticky; top:0; background:var(--brown);
           border-bottom:1px solid rgba(242,231,209,.16); z-index:2; }
  h1 { margin:0; font-size:17px; letter-spacing:.02em; }
  .count { opacity:.7; font-size:13px; margin-top:3px; }
  .grid { display:grid; gap:18px; padding:16px;
          grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); }
  .card { background:rgba(242,231,209,.05); border:1px solid rgba(242,231,209,.14);
          border-radius:14px; overflow:hidden; }
  video { width:100%; display:block; background:#000; aspect-ratio:9/16; }
  .meta { padding:11px 13px 13px; }
  .who { font-weight:700; }
  .plat { font-weight:400; opacity:.55; font-size:12px; text-transform:uppercase;
          margin-left:5px; }
  .t { margin-top:3px; opacity:.92; }
  .sub { margin-top:3px; opacity:.6; font-size:13px; }
  .cap { width:100%; margin-top:10px; padding:9px 10px; border-radius:9px;
         background:rgba(0,0,0,.30); color:var(--cream);
         border:1px solid rgba(242,231,209,.22); font:14px/1.4 inherit;
         resize:vertical; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip { background:rgba(242,231,209,.10); color:var(--cream); cursor:pointer;
          border:1px solid rgba(242,231,209,.22); border-radius:999px;
          padding:5px 10px; font:12px inherit; }
  .chip:active { background:rgba(242,231,209,.22); }
  .btns { display:flex; gap:9px; margin-top:11px; }
  .btns button { flex:1; padding:11px 0; border:0; border-radius:9px;
                 font:700 15px inherit; color:#fff; cursor:pointer; }
  .ok { background:var(--ok); }
  .no { background:var(--no); }
  .hold { background:transparent; color:var(--cream);
          border:1px solid rgba(242,231,209,.35) !important; flex:0 0 78px !important; }
  .more { display:flex; gap:8px; margin-top:11px; }
  .get { flex:1; padding:11px 0; border-radius:9px; cursor:pointer;
         background:var(--cream); color:var(--brown); border:0;
         font:700 15px inherit; }
  .get.alt { flex:0 0 74px; background:transparent; color:var(--cream);
             border:1px solid rgba(242,231,209,.35); }
  .get.wipe { background:transparent; color:#e5867d;
              border:1px solid rgba(229,134,125,.55); font-weight:600; }
  footer { padding:22px 16px 40px; opacity:.55; font-size:12px; }
  .empty { padding:40px 16px; opacity:.7; }
  .done { opacity:.35; }
  #toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
           background:var(--cream); color:var(--brown); padding:9px 16px;
           border-radius:999px; font-weight:700; opacity:0; transition:opacity .2s;
           pointer-events:none; z-index:9; }
  #toast.on { opacity:1; }
</style></head><body>

<header>
  <h1>aminal.house &mdash; review</h1>
  <div class="count" id="count">loading…</div>
  <div class="more">
    <button class="get" onclick="getMore(10)">Get 10 more videos</button>
    <button class="get alt" onclick="getMore(30)">30</button>
  </div>
  <div class="more">
    <button class="get wipe" onclick="clearQueue(30)">Clear queue &amp; get 30 fresh</button>
  </div>
</header>

<div id="grid" class="empty">loading…</div>
<div id="toast"></div>

<footer>
  Approve or Skip records a verdict straight to storage where one is available,
  otherwise it opens a prefilled GitHub issue. This PC acts on it within a
  minute. Nothing publishes without a decision.
</footer>

<script>
// The review repo, used only for the bulk actions. Per-video verdicts go
// straight to storage via the presigned URLs in the manifest, which needs no
// GitHub round trip; "clear" and "batch" have no per-video URL to ride on, so
// they travel as issues the way Clipped House does it.
var REPO = "aleclewiss/aminal-review";
var BASE_TAGS = ["animals", "dogs", "puppies", "cute", "fyp", "shorts", "animalshorts"];
var items = [], settled = {};

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function toast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg; t.className = "on";
  setTimeout(function () { t.className = ""; }, 1600);
}

function tagsFor(it) {
  // The category is the most specific thing known about an animal video, and
  // it is exactly what someone would search. It leads.
  var own = [];
  if (it.category) own.push(String(it.category).replace(/[^a-z0-9]/gi, "").toLowerCase());
  return own.concat(BASE_TAGS).filter(function (t, i, a) { return t && a.indexOf(t) === i; });
}

function addTag(stem, tag) {
  var ta = document.getElementById("c_" + stem);
  var t = "#" + tag;
  if (ta.value.indexOf(t) >= 0) return;      // one tap adds, not duplicates
  ta.value = (ta.value.replace(/\s+$/, "") + " " + t).trim();
}

function card(it) {
  var tags = tagsFor(it);
  var chips = tags.map(function (t) {
    return '<button class="chip" onclick="addTag(\'' + esc(it.stem) + "','" + esc(t) + '\')">#' + esc(t) + "</button>";
  }).join("");
  var title = (it.title || "").trim();
  var caption = (title.length > 5 ? title + "\n\n" : "") +
                tags.slice(0, 7).map(function (t) { return "#" + t; }).join(" ");
  return '<section class="card" id="card_' + esc(it.stem) + '">' +
    '<video src="' + esc(it.url) + '" controls preload="none" playsinline></video>' +
    '<div class="meta">' +
      '<div class="who">' + esc(it.channel || "aminal.house") +
        '<span class="plat">' + esc(it.category || "") + "</span></div>" +
      (title ? '<div class="t">' + esc(title) + "</div>" : "") +
      '<div class="sub">' + esc(it.size_mb || "?") + " MB &middot; " +
        esc((it.queued_at || "").slice(0, 16).replace("T", " ")) + "</div>" +
      '<textarea id="c_' + esc(it.stem) + '" class="cap" rows="4" ' +
        'placeholder="Caption for TikTok / YouTube...">' + esc(caption) + "</textarea>" +
      '<div class="chips">' + chips + "</div>" +
      '<div class="btns">' +
        '<button class="ok" onclick="send(\'' + esc(it.stem) + '\',\'approve\')">Approve</button>' +
        '<button class="no" onclick="send(\'' + esc(it.stem) + '\',\'reject\')">Reject</button>' +
        '<button class="no hold" onclick="send(\'' + esc(it.stem) + '\',\'hold\')">Hold</button>' +
      "</div>" +
    "</div></section>";
}

function render() {
  var live = items.filter(function (i) { return !settled[i.stem]; });
  document.getElementById("count").textContent =
    live.length + " waiting · updated " + new Date().toLocaleString();
  var g = document.getElementById("grid");
  if (!live.length) {
    g.className = "empty";
    g.textContent = "Nothing waiting. Use the buttons above to render more.";
    return;
  }
  g.className = "grid";
  g.innerHTML = live.map(card).join("");
}

async function load() {
  try {
    var r = await fetch("pending.json?t=" + Date.now(), { cache: "no-store" });
    if (r.ok) items = ((await r.json()).items) || [];
  } catch (e) { /* offline: keep whatever is on screen */ }
  render();
}

async function send(stem, verdict) {
  var it = items.filter(function (i) { return i.stem === stem; })[0];
  if (!it) return;
  var ta = document.getElementById("c_" + stem);
  var caption = ta ? ta.value : "";
  var url = it[verdict + "_url"];             // presigned PUT, when present
  var card = document.getElementById("card_" + stem);
  if (card) card.className = "card done";
  settled[stem] = true;
  if (url) {
    try {
      // The caption rides in the body so an approved video carries the words
      // that were typed next to it, exactly as Clipped House does.
      await fetch(url, { method: "PUT", body: verdict === "approve" ? caption : verdict });
      toast(verdict === "approve" ? "Approved" : verdict === "hold" ? "Held" : "Skipped");
      return;
    } catch (e) { /* fall through to the issue path */ }
  }
  var issue = it[verdict + "_issue"];
  if (issue) {
    window.open(issue, "_blank", "noopener");
    toast("Opening issue…");
  } else {
    toast("No verdict route available");
    settled[stem] = false;
    if (card) card.className = "card";
  }
}

function getMore(n) {
  var url = "https://github.com/" + REPO + "/issues/new" +
    "?title=" + encodeURIComponent("batch: " + n) +
    "&body=" + encodeURIComponent("Submit to render " + n + " more videos.");
  window.open(url, "_blank", "noopener");
}

function clearQueue(n) {
  var total = items.filter(function (i) { return !settled[i.stem]; }).length;
  var msg = "Reject all " + total + " videos waiting, and render " + n +
            " fresh ones? Rejected videos never come back.";
  if (!confirm(msg)) return;
  var url = "https://github.com/" + REPO + "/issues/new" +
    "?title=" + encodeURIComponent("clear: " + n) +
    "&body=" + encodeURIComponent("Submit to reject all pending videos and render " +
                                  n + " fresh ones.");
  window.open(url, "_blank", "noopener");
}

load();
setInterval(load, 60000);      // the PC republishes the manifest as it works
</script>
</body></html>
