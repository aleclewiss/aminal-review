<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#131019">
<title>Aminal House Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Outfit:wght@300;400;500;600&display=swap">
<style>
  /* Aminal House palette: the channel's own hot pink on a near-black that
     carries a slight violet bias toward it, rather than a neutral grey. */
  :root{
    --ink:#131019; --surface:#1c1824; --raised:#241f2e; --line:#332b3f;
    --fg:#f6f2f8; --dim:#a096ad; --faint:#6f6679;
    --accent:#ff3d8a; --go:#3ddc84; --stop:#ff5f56; --hold:#ffc25c;
    --shadow:0 10px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--ink); color:var(--fg);
    font:400 16px/1.55 Outfit,system-ui,-apple-system,Segoe UI,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  header{
    position:sticky; top:0; z-index:20;
    background:rgba(19,16,25,.92); backdrop-filter:saturate(1.4) blur(12px);
    border-bottom:1px solid var(--line);
    padding:calc(14px + env(safe-area-inset-top)) 20px 14px;
    display:flex; align-items:baseline; gap:12px;
  }
  .brand{
    font-family:Syne,Outfit,sans-serif; font-weight:800; font-size:19px;
    letter-spacing:-.01em; margin:0; flex:1;
  }
  .brand em{font-style:normal; color:var(--accent)}
  .total{font-variant-numeric:tabular-nums; font-size:13px; color:var(--dim); font-weight:500}

  main{max-width:1080px; margin:0 auto; padding:6px 16px calc(20px + env(safe-area-inset-bottom))}

  /* One section per category. The heading is the organising device because the
     queue genuinely arrives that way: each scheduled slot renders one breed. */
  .cat{border-bottom:1px solid var(--line); padding:20px 0}
  .cat:last-child{border-bottom:0}
  .cat-head{
    display:flex; align-items:center; gap:10px; width:100%;
    background:none; border:0; padding:0 0 14px; cursor:pointer;
    color:var(--fg); text-align:left; font:inherit;
  }
  .cat-name{
    font-family:Syne,sans-serif; font-weight:700; font-size:15px;
    letter-spacing:.06em; text-transform:uppercase;
  }
  .cat-n{
    font-size:12px; font-variant-numeric:tabular-nums; color:var(--accent);
    background:rgba(255,61,138,.13); border:1px solid rgba(255,61,138,.28);
    border-radius:999px; padding:1px 9px; font-weight:600;
  }
  .chev{margin-left:auto; color:var(--faint); transition:transform .18s ease}
  .cat[data-open="0"] .chev{transform:rotate(-90deg)}
  .cat[data-open="0"] .grid{display:none}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:18px}

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    overflow:hidden; display:flex; flex-direction:column; box-shadow:var(--shadow);
  }
  .card.settled{opacity:.5}
  video{width:100%; aspect-ratio:9/16; background:#000; display:block; object-fit:contain}
  .meta{padding:13px 15px 4px}
  .title{font-weight:600; line-height:1.32; letter-spacing:-.005em}
  .sub{
    margin-top:6px; color:var(--dim); font-size:12.5px; font-weight:300;
    display:flex; flex-wrap:wrap; gap:6px; align-items:center;
  }
  .pill{
    background:var(--raised); border:1px solid var(--line); color:#cdc5d6;
    border-radius:999px; padding:1px 9px; font-size:11.5px; font-weight:500;
  }
  .pill.ch{color:var(--accent); border-color:rgba(255,61,138,.3)}

  .actions{display:flex; gap:8px; padding:12px 15px 15px}
  .btn{
    flex:1; padding:12px 8px; border:1px solid transparent; border-radius:11px;
    font:600 14.5px Outfit,sans-serif; cursor:pointer; color:#120d16;
    transition:filter .15s ease, opacity .15s ease;
  }
  .btn:hover:not(:disabled){filter:brightness(1.08)}
  .btn:focus-visible{outline:2px solid var(--fg); outline-offset:2px}
  .btn:disabled{opacity:.45; cursor:default}
  .go{background:var(--go)}
  .no{background:transparent; color:var(--stop); border-color:rgba(255,95,86,.45); flex:0 0 88px}
  .later{background:transparent; color:var(--hold); border-color:rgba(255,194,92,.4); flex:0 0 88px}

  .note{padding:0 15px 15px; font-size:12.5px; color:var(--dim); font-weight:300}
  .note b{color:var(--fg); font-weight:600}

  .empty{text-align:center; color:var(--dim); padding:80px 20px; font-weight:300}
  .empty strong{display:block; font-family:Syne,sans-serif; font-weight:700;
    color:var(--fg); font-size:17px; margin-bottom:6px}

  footer{
    max-width:1080px; margin:0 auto; padding:4px 16px calc(40px + env(safe-area-inset-bottom));
    color:var(--faint); font-size:12px; font-weight:300;
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1 class="brand">Aminal <em>House</em></h1>
  <span class="total" id="total"></span>
</header>

<main id="main"></main>
<footer id="foot"></footer>

<script>
// This page holds no credential. Every item carries presigned PUT URLs minted
// by the pipeline machine; the signature in the URL is the entire permission,
// and it can write exactly one small object. That PC polls for those objects
// and does the publishing, so no YouTube / Instagram / TikTok token is ever
// present here.
var settled = {};                       // stem -> verdict, survives a reload
try { settled = JSON.parse(localStorage.getItem("settled") || "{}"); } catch(e){}
var collapsed = {};
try { collapsed = JSON.parse(localStorage.getItem("collapsed") || "{}"); } catch(e){}

function save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
  });
}
function ago(iso){
  if(!iso) return "";
  var t = Date.parse(iso);
  if(isNaN(t)) return "";
  var h = (Date.now() - t) / 3.6e6;
  if(h < 1) return Math.max(1, Math.round(h * 60)) + "m ago";
  if(h < 24) return Math.round(h) + "h ago";
  return Math.round(h / 24) + "d ago";
}
var VERDICT_TEXT = {
  approve: "Posting now — your PC picks this up within a minute.",
  reject:  "Skipped. It won’t be posted.",
  hold:    "Held. It stays in the queue."
};

async function load(){
  var main = document.getElementById("main");
  var items = [];
  try{
    // Pages caches hard; a stale queue is worse than an empty one.
    var r = await fetch("pending.json?t=" + Date.now(), {cache:"no-store"});
    if(r.ok){ items = (await r.json()).items || []; }
  }catch(e){}

  var live = items.filter(function(i){ return !settled[i.stem]; });
  document.getElementById("total").textContent = live.length ? live.length + " waiting" : "all clear";
  document.getElementById("foot").textContent =
    "Nothing posts unless you approve it. Videos wait here indefinitely.";

  if(!items.length){
    main.innerHTML = '<div class="empty"><strong>Nothing waiting</strong>' +
      'New videos land here as the pipeline finishes them.</div>';
    return;
  }

  var groups = {};
  items.forEach(function(i){
    var k = i.category || "other";
    (groups[k] = groups[k] || []).push(i);
  });

  main.innerHTML = "";
  Object.keys(groups).sort().forEach(function(cat){
    var list = groups[cat];
    var open = collapsed[cat] ? 0 : 1;
    var sec = document.createElement("section");
    sec.className = "cat";
    sec.setAttribute("data-open", open);

    var head = document.createElement("button");
    head.className = "cat-head";
    head.setAttribute("aria-expanded", open ? "true" : "false");
    var undecided = list.filter(function(i){ return !settled[i.stem]; }).length;
    head.innerHTML = '<span class="cat-name">' + esc(cat) + '</span>' +
                     '<span class="cat-n">' + undecided + '</span>' +
                     '<span class="chev">▾</span>';
    head.onclick = function(){
      var now = sec.getAttribute("data-open") === "1" ? 0 : 1;
      sec.setAttribute("data-open", now);
      head.setAttribute("aria-expanded", now ? "true" : "false");
      collapsed[cat] = !now;
      save("collapsed", collapsed);
    };
    sec.appendChild(head);

    var grid = document.createElement("div");
    grid.className = "grid";
    list.forEach(function(i){ grid.appendChild(cardFor(i)); });
    sec.appendChild(grid);
    main.appendChild(sec);
  });
}

function cardFor(i){
  var card = document.createElement("div");
  card.className = "card" + (settled[i.stem] ? " settled" : "");
  card.innerHTML =
    '<video src="' + esc(i.url) + '" controls preload="metadata" playsinline></video>' +
    '<div class="meta"><div class="title">' + esc(i.title || "(untitled)") + '</div>' +
    '<div class="sub"><span class="pill ch">' + esc(i.channel) + '</span>' +
    '<span class="pill">' + esc(i.category) + '</span>' +
    esc(i.size_mb) + ' MB' + (i.queued_at ? ' · ' + esc(ago(i.queued_at)) : '') +
    '</div></div>';

  if(settled[i.stem]){
    var done = document.createElement("div");
    done.className = "note";
    done.innerHTML = "<b>" + esc(VERDICT_TEXT[settled[i.stem]] || "Done.") + "</b>";
    card.appendChild(done);
    return card;
  }

  var row = document.createElement("div");
  row.className = "actions";
  [["approve", "Post it", "btn go"],
   ["hold",    "Later",   "btn later"],
   ["reject",  "Skip",    "btn no"]].forEach(function(spec){
    var b = document.createElement("button");
    b.className = spec[2];
    b.textContent = spec[1];
    b.onclick = function(){ decide(i, spec[0], card, row); };
    row.appendChild(b);
  });
  card.appendChild(row);
  return card;
}

async function decide(item, verdict, card, row){
  row.querySelectorAll("button").forEach(function(b){ b.disabled = true; });
  var note = document.createElement("div");
  note.className = "note";
  note.textContent = "Saving…";
  card.appendChild(note);

  var url = item[verdict + "_url"];
  if(!url){
    note.textContent = "That option isn’t available for this video — reload the page.";
    return;
  }
  try{
    var res = await fetch(url, {method:"PUT", body: verdict});
    if(!res.ok) throw new Error("HTTP " + res.status);
    settled[item.stem] = verdict;
    save("settled", settled);
    note.innerHTML = "<b>" + esc(VERDICT_TEXT[verdict]) + "</b>";
    card.classList.add("settled");
    row.remove();
  }catch(e){
    note.textContent = "Couldn’t save that (" + e.message +
      "). The link may have expired — reload and try again.";
    row.querySelectorAll("button").forEach(function(b){ b.disabled = false; });
  }
}

load();
setInterval(load, 30000);
</script>
</body>
</html>
