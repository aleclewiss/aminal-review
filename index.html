<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aminal House — Review</title>
<style>
  :root{
    --bg:#0c0c10; --card:#16161c; --line:#282833; --fg:#f0f0f4; --dim:#9a9aa8;
    --ok:#2ecc71; --no:#e74c3c; --accent:#ff3d8a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:16px/1.5 -apple-system,BlinkMacSystemFont,system-ui,Segoe UI,sans-serif;
       -webkit-font-smoothing:antialiased}
  header{position:sticky;top:0;z-index:9;background:rgba(12,12,16,.94);
         backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
         padding:calc(12px + env(safe-area-inset-top)) 18px 12px;
         display:flex;align-items:center;gap:10px}
  h1{font-size:16px;margin:0;letter-spacing:.2px;flex:1}
  .count{color:var(--dim);font-size:13px}
  .gear{background:none;border:0;color:var(--dim);font-size:19px;cursor:pointer;padding:4px}
  main{max-width:920px;margin:0 auto;padding:16px 16px calc(28px + env(safe-area-inset-bottom));
       display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
        overflow:hidden;display:flex;flex-direction:column}
  video{width:100%;aspect-ratio:9/16;background:#000;display:block;object-fit:contain}
  .meta{padding:12px 14px 8px}
  .t{font-weight:650;line-height:1.3}
  .s{color:var(--dim);font-size:12.5px;margin-top:5px}
  .tag{display:inline-block;background:#23232c;border-radius:999px;padding:1px 9px;
       font-size:11.5px;color:#c8c8d6;margin-right:5px}
  .row{display:flex;gap:10px;padding:8px 14px 14px}
  button.act{flex:1;padding:13px;border:0;border-radius:11px;font-weight:700;
             font-size:15px;cursor:pointer}
  .yes{background:var(--ok);color:#07120b}
  .nope{background:var(--no);color:#fff}
  button:disabled{opacity:.45}
  .note{padding:0 14px 14px;font-size:12.5px;color:var(--dim)}
  .empty{grid-column:1/-1;text-align:center;color:var(--dim);padding:64px 20px}
  dialog{background:var(--card);color:var(--fg);border:1px solid var(--line);
         border-radius:16px;padding:20px;max-width:420px;width:calc(100% - 36px)}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  input{width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);
        background:#0f0f14;color:var(--fg);font-size:15px;margin-top:8px}
  .hint{color:var(--dim);font-size:13px;margin-top:10px}
  .hint code{background:#0f0f14;padding:1px 5px;border-radius:4px}
  dialog button{margin-top:14px;padding:11px 16px;border:0;border-radius:9px;
                background:var(--accent);color:#fff;font-weight:700;font-size:15px;
                cursor:pointer;width:100%}
  a{color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>Aminal House</h1>
  <span class="count" id="count"></span>
</header>
<main id="grid"></main>


<script>
// No credential lives in this page. Each item carries presigned PUT URLs that
// the pipeline machine generated; the signature in the URL is the only
// permission, and it can write exactly one small object. The PC polls the
// bucket for those objects and does the actual publishing, so no upload token
// for YouTube, Instagram, TikTok or Facebook is ever exposed here.
var $ = function(id){ return document.getElementById(id); };

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
  });
}

function ago(iso){
  if(!iso) return "";
  var t = Date.parse(iso);
  if(isNaN(t)) return "";
  var h = (Date.now() - t) / 3.6e6;
  if(h < 1) return Math.max(1, Math.round(h * 60)) + "m ago";
  if(h < 24) return Math.round(h) + "h ago";
  return Math.round(h / 24) + "d ago";
}

var acted = {};   // stem -> "approve" | "reject", so a decided card stays decided

async function load(){
  var grid = $("grid");
  var items = [];
  try {
    // Pages caches hard; a stale queue is worse than an empty one.
    var r = await fetch("pending.json?t=" + Date.now(), {cache: "no-store"});
    if(r.ok){ items = (await r.json()).items || []; }
  } catch(e){}

  $("count").textContent = items.length ? items.length + " waiting" : "";
  grid.innerHTML = "";

  if(!items.length){
    grid.innerHTML = "<div class=empty>Nothing waiting.<br>New videos appear here as the pipeline finishes them.</div>";
    return;
  }

  items.forEach(function(i){
    var card = document.createElement("div");
    card.className = "card";
    card.innerHTML =
      '<video src="' + esc(i.url) + '" controls preload="metadata" playsinline></video>' +
      '<div class="meta"><div class="t">' + esc(i.title || "(untitled)") + '</div>' +
      '<div class="s"><span class="tag">' + esc(i.channel) + '</span>' +
      '<span class="tag">' + esc(i.category) + '</span>' +
      esc(i.size_mb) + ' MB &middot; ' + esc(ago(i.queued_at)) + '</div></div>' +
      '<div class="row"></div>';
    var row = card.querySelector(".row");

    if(acted[i.stem]){
      var done = document.createElement("div");
      done.className = "note";
      done.textContent = acted[i.stem] === "approve"
        ? "Approved - your PC will publish it within a minute."
        : "Rejected.";
      card.appendChild(done);
      card.style.opacity = .55;
    } else {
      var yes = document.createElement("button");
      yes.className = "act yes"; yes.textContent = "Yes, post it";
      var no = document.createElement("button");
      no.className = "act nope"; no.textContent = "No";
      yes.onclick = function(){ decide(i, "approve", card, row); };
      no.onclick  = function(){ decide(i, "reject",  card, row); };
      row.appendChild(yes); row.appendChild(no);
    }
    grid.appendChild(card);
  });
}

async function decide(item, verdict, card, row){
  row.querySelectorAll("button").forEach(function(b){ b.disabled = true; });
  var note = document.createElement("div");
  note.className = "note";
  note.textContent = verdict === "approve" ? "Approving..." : "Rejecting...";
  card.appendChild(note);

  var url = verdict === "approve" ? item.approve_url : item.reject_url;
  if(!url){
    note.textContent = "This item is missing its verdict link - reload the page.";
    return;
  }
  try{
    var res = await fetch(url, {method: "PUT", body: verdict});
    if(!res.ok){ throw new Error("HTTP " + res.status); }
    acted[item.stem] = verdict;
    note.textContent = verdict === "approve"
      ? "Approved - your PC will publish it within a minute."
      : "Rejected.";
    card.style.opacity = .55;
  } catch(e){
    note.textContent = "Failed: " + e.message + " - the link may have expired; reload.";
    row.querySelectorAll("button").forEach(function(b){ b.disabled = false; });
  }
}

load();
setInterval(load, 30000);
</script>
</body>
</html>
